<div class="goal-widget">
  <!-- 1 · Donaciones · 💰 -->
  <div class="goal-row goal-row--donation" data-row="donation">
    <div class="goal-icon" aria-hidden="true">
      <div class="goal-icon-circle goal-icon-circle--donation">
        <span class="goal-icon-emoji">💰</span>
      </div>
    </div>
    <div class="goal-body">
      <div class="goal-header">
        <span class="goal-label">{{labelDonation}}</span>
        <span class="goal-stat js-donation-stat">$0 / $0</span>
      </div>
      <div class="goal-track goal-track--donation">
        <div class="goal-fill js-donation-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- 2 · Seguidores · 💗 -->
  <div class="goal-row goal-row--follower" data-row="follower">
    <div class="goal-icon" aria-hidden="true">
      <div class="goal-icon-circle goal-icon-circle--follower">
        <span class="goal-icon-emoji">💜</span>
      </div>
    </div>
    <div class="goal-body">
      <div class="goal-header">
        <span class="goal-label">{{labelFollower}}</span>
        <span class="goal-stat js-follower-stat">0 / 0</span>
      </div>
      <div class="goal-track goal-track--follower">
        <div class="goal-fill js-follower-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- 3 · Subs · 🎁 -->
  <div class="goal-row goal-row--sub" data-row="sub">
    <div class="goal-icon" aria-hidden="true">
      <div class="goal-icon-circle goal-icon-circle--sub">
        <span class="goal-icon-emoji">🎁</span>
      </div>
    </div>
    <div class="goal-body">
      <div class="goal-header">
        <span class="goal-label">{{labelSub}}</span>
        <span class="goal-stat js-sub-stat">0 / 0</span>
      </div>
      <div class="goal-track goal-track--sub">
        <div class="goal-fill js-sub-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- 4 · Bits · 💎 -->
  <div class="goal-row goal-row--bits js-row-bits" data-row="bits">
    <div class="goal-icon" aria-hidden="true">
      <div class="goal-icon-circle goal-icon-circle--bits">
        <span class="goal-icon-emoji">💎</span>
      </div>
    </div>
    <div class="goal-body">
      <div class="goal-header">
        <span class="goal-label">{{labelBits}}</span>
        <span class="goal-stat js-bits-stat">0 / 0</span>
      </div>
      <div class="goal-track goal-track--bits">
        <div class="goal-fill js-bits-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- 5 · Personalizada · corazón -->
  <div class="goal-row goal-row--custom js-row-custom" data-row="custom">
    <div class="goal-icon" aria-hidden="true">
      <div class="goal-icon-circle goal-icon-circle--custom">
        <svg class="goal-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 21 C10 18 4 13 4 9 C4 6 6 4 9 4 C11 4 12 5 12 5 C12 5 13 4 15 4 C18 4 20 6 20 9 C20 13 14 18 12 21 Z"
            fill="currentColor"
          />
        </svg>
      </div>
    </div>
    <div class="goal-body">
      <div class="goal-header">
        <span class="goal-label">{{labelCustom}}</span>
        <span class="goal-stat js-custom-stat">0 / 0</span>
      </div>
      <div class="goal-track goal-track--custom">
        <div class="goal-fill js-custom-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>
</div>
